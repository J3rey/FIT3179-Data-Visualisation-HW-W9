<!DOCTYPE html>
<html>
  <head>
    <title>Olympics Visualizations</title>
    <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
      }
      h1 {
        text-align: center;
      }
      h2 {
        margin-top: 40px;
      }
      .viz {
        width: 100%;
        height: 500px;
        border: 1px solid #ccc;
        margin: 10px 0;
      }
    </style>
  </head>
  <body>
    <h1>Olympics Data Visualizations</h1>

    <h2>Bronze Medal Distribution Map</h2>
    <div id="map" class="viz"></div>

    <h2>Athlete Age Distribution</h2>
    <div id="chart" class="viz"></div>

    <script>
      // Load map
      fetch("js/chloropleth_map.vg.json")
        .then((response) => response.json())
        .then((spec) => vegaEmbed("#map", spec))
        .catch((error) => console.error("Map error:", error));

      // Load chart
      fetch("js/segmented_chart.json")
        .then((response) => response.json())
        .then((spec) => vegaEmbed("#chart", spec))
        .catch((error) => console.error("Chart error:", error));
    </script>
  </body>
</html>
