<!DOCTYPE html>
<html>
  <head>
    <script src="https://cdn.jsdelivr.net/npm/vega@5.22.1"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite@5.2.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-embed@6.20.8"></script>
  </head>
  <body>
    <div id="vis" />
    <script>
      const spec = {
        $schema: "https://vega.github.io/schema/vega-lite/v5.json",
        title: "Bronze Medallists by Country - Summer Paris Olympics 2024",
        width: 800,
        height: 400,
        data: {
          url: "https://raw.githubusercontent.com/J3rey/FIT3179-Data-Visualisation-HW-W9/refs/heads/main/js/ne_110m.topojson",
          format: { type: "topojson", feature: "ne_110m_admin_0_countries" },
        },
        projection: { type: "naturalEarth1" },
        layer: [
          {
            transform: [
              {
                calculate:
                  "'Data is not available in ' + datum.properties.NAME",
                as: "note",
              },
            ],
            mark: { type: "geoshape", fill: "lightgray", stroke: "white" },
            encoding: { tooltip: { field: "note" } },
          },
          {
            data: {
              url: "https://raw.githubusercontent.com/FIT3179/Vega-Lite/main/7_others/oceans.topojson",
              format: { type: "topojson", feature: "oceans" },
            },
            mark: { type: "geoshape", fill: "skyblue" },
          },
          {
            data: {
              url: "https://raw.githubusercontent.com/FIT3179/Vega-Lite/main/2_symbol_map/js/WorldMapWithGraticules.topojson",
              format: { type: "topojson", feature: "ne_110m_graticules_30" },
            },
            mark: { type: "geoshape", fill: null, stroke: "lightgray" },
          },
          {
            transform: [
              {
                lookup: "properties.NAME",
                from: {
                  data: {
                    url: "https://raw.githubusercontent.com/J3rey/FIT3179-Data-Visualisation-HW-W9/refs/heads/main/data/cleaned_medallists.csv",
                  },
                  key: "country",
                  fields: ["medal_type"],
                },
              },
              {
                filter: "datum.medal_type == 'Bronze Medal'",
              },
              {
                aggregate: [{ op: "count", as: "bronze_count" }],
                groupby: ["properties.NAME"],
              },
            ],
            mark: { type: "geoshape", stroke: "white" },
            encoding: {
              color: {
                field: "bronze_count",
                type: "quantitative",
                scale: {
                  type: "threshold",
                  domain: [1, 5, 15],
                  range: ["#FFD39B", "#CD7F32", "#8C6239", "#5C4033"],
                },
                legend: { title: "Bronze Medals" },
              },
              tooltip: [
                { field: "properties.NAME", type: "nominal", title: "Country" },
                {
                  field: "bronze_count",
                  type: "quantitative",
                  title: "Bronze Medals",
                },
              ],
            },
          },
        ],
        config: {},
      };
      vegaEmbed("#vis", spec, { mode: "vega-lite" })
        .then(console.log)
        .catch(console.warn);
    </script>
  </body>
</html>
