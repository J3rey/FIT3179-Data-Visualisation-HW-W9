<!DOCTYPE html>
<html>
  <head>
    <script src="https://cdn.jsdelivr.net/npm/vega@5.22.1"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite@5.2.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-embed@6.20.8"></script>
    <link rel="stylesheet" type="text/css" href="css/styles.css" />
  </head>
  <body>
    <div id="vis" />
    <script>
      const spec = {
        $schema: "https://vega.github.io/schema/vega-lite/v5.json",
        title: {
          text: "Bronze Medallists by Country - Summer Paris Olympics 2024",
          fontSize: 24,
          fontWeight: "bold",
          anchor: "middle",
          offset: 20,
        },
        width: "container",
        height: "container",
        autosize: {
          type: "fit",
          contains: "padding",
        },
        data: {
          url: "https://raw.githubusercontent.com/J3rey/FIT3179-Data-Visualisation-HW-W9/refs/heads/main/symbols/ne_110m.topojson",
          format: { type: "topojson", feature: "ne_110m_admin_0_countries" },
        },
        projection: { type: "naturalEarth1" },
        layer: [
          {
            transform: [
              {
                calculate:
                  "'Data is not available in ' + datum.properties.NAME",
                as: "note",
              },
            ],
            mark: { type: "geoshape", fill: "lightgray", stroke: "white" },
            encoding: { tooltip: { field: "note" } },
          },
          {
            data: {
              url: "https://raw.githubusercontent.com/J3rey/FIT3179-Data-Visualisation-HW-W9/refs/heads/main/symbols/oceans.topojson",
              format: { type: "topojson", feature: "oceans" },
            },
            mark: { type: "geoshape", fill: "skyblue" },
          },
          {
            data: {
              url: "https://raw.githubusercontent.com/J3rey/FIT3179-Data-Visualisation-HW-W9/refs/heads/main/symbols/WorldMapWithGraticules.topojson",
              format: { type: "topojson", feature: "ne_110m_graticules_30" },
            },
            mark: { type: "geoshape", fill: null, stroke: "lightgray" },
          },
          {
            transform: [
              {
                lookup: "properties.NAME",
                from: {
                  data: {
                    url: "https://raw.githubusercontent.com/J3rey/FIT3179-Data-Visualisation-HW-W9/refs/heads/main/data/cleaned_medallists.csv",
                  },
                  key: "country",
                  fields: ["medal_type"],
                },
              },
              {
                filter: "datum.medal_type == 'Bronze Medal'",
              },
              {
                aggregate: [{ op: "count", as: "bronze_count" }],
                groupby: ["properties.NAME"],
              },
            ],
            mark: { type: "geoshape", stroke: "white" },
            encoding: {
              color: {
                field: "bronze_count",
                type: "quantitative",
                scale: {
                  type: "threshold",
                  domain: [1, 5, 15],
                  range: ["#FFD39B", "#CD7F32", "#8C6239", "#5C4033"],
                },
                legend: {
                  title: "Bronze Medals",
                  titleFontSize: 14,
                  titleFontWeight: "bold",
                  titleColor: "#2c3e50",
                  labelFontSize: 12,
                  labelColor: "#34495e",
                  orient: "right",
                  offset: 20,
                  cornerRadius: 5,
                  padding: 10,
                  strokeColor: "#bdc3c7",
                  fillColor: "rgba(255, 255, 255, 0.9)",
                  symbolSize: 200,
                },
              },
              tooltip: [
                { field: "properties.NAME", type: "nominal", title: "Country" },
                {
                  field: "bronze_count",
                  type: "quantitative",
                  title: "Bronze Medals",
                },
              ],
            },
          },
        ],
        config: {
          title: {
            fontSize: 24,
            fontWeight: "bold",
            color: "#2c3e50",
            offset: 10,
            anchor: "middle",
          },
          view: {
            stroke: null,
          },
          legend: {
            titleFontSize: 14,
            titleFontWeight: "bold",
            titleColor: "#2c3e50",
            labelFontSize: 12,
            labelColor: "#34495e",
            cornerRadius: 5,
            padding: 10,
          },
        },
      };
      vegaEmbed("#vis", spec, { mode: "vega-lite" })
        .then(console.log)
        .catch(console.warn);
    </script>
  </body>
</html>
