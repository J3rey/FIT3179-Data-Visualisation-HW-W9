<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Butterfly Chart - Athletes Age Distribution by Gender</title>
    <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
      }
      #vis {
        margin: 20px auto;
      }
      h1 {
        text-align: center;
        color: #333;
      }
    </style>
  </head>
  <body>
    <h1>Athletes Age Distribution by Gender</h1>
    <div id="vis"></div>

    <script type="text/javascript">
      vegaEmbed("#vis", "butterfly chart.vg.json")
        .then((result) => {
          console.log("Visualization loaded successfully");
        })
        .catch((error) => {
          console.error("Error loading visualization:", error);
          document.getElementById("vis").innerHTML =
            '<p style="color: red;">Error loading visualization: ' +
            error.message +
            "</p>";
        });
    </script>
  </body>
</html>
